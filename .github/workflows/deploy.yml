# Builds the static site on every push to main and publishes the contents of
# /out to the `deploy` branch. Hostinger auto-deploys from the `deploy` branch.
name: Build static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aeroclean.sbs

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Publish /out to the deploy branch
        run: |
          cd out
          touch .nojekyll
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
